services:
  nexus:
    build: .
    image: nexus-ai-platform:latest
    ports:
      - "8000:8000"
    environment:
      NEXUS_PROVIDER: ollama
      NEXUS_OLLAMA_BASE_URL: http://ollama:11434
      NEXUS_OLLAMA_MODEL: qwen2.5:1.5b-instruct
      NEXUS_EMBED_PROVIDER: ollama
      NEXUS_OLLAMA_EMBED_MODEL: bge-m3
      NEXUS_PERSIST: "true"
      NEXUS_DATA_DIR: /app/data
    volumes:
      - nexus-data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  ollama-models:
  nexus-data:
