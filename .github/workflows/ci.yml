name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · Python 3.13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: 静态检查
        run: ruff check packages/core

      - name: 类型检查
        run: mypy --ignore-missing-imports packages/core/nexus

      - name: 单元测试
        run: pytest -q

      - name: 离线冒烟
        run: python scripts/smoke.py

      - name: 真实进程端到端
        run: python scripts/e2e.py --provider mock

      - name: 回归评测门禁
        run: python scripts/eval.py

      - name: P0 扫描（禁止 emoji 图标）
        run: python scripts/scan_emoji.py

  frontend:
    name: 前端 · Node 22
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查与构建
        run: npm run build
